
name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    name: Build Codename Engine Android
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      HAXE_VERSION: "4.3.7"
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "25.2.9519653"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.7"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"
          yes | sdkmanager --licenses || true

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "JAVA_HOME_17_X64=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install Haxe dependencies
        shell: bash
        run: |
          set -euxo pipefail

          haxelib setup "$HOME/haxelib"

          if [ -f project.xml ]; then
            echo "Found project.xml"
          elif [ -f Project.xml ]; then
            echo "Found Project.xml"
          else
            echo "Project XML not found in repository root."
            ls -la
            exit 1
          fi

          if [ -f haxelib.json ]; then
            haxelib install haxelib.json --always
          fi

          if [ -f project.hxml ]; then
            echo "Found project.hxml"
          fi

      - name: Install Codename Engine dependencies
        shell: bash
        run: |
          set -euxo pipefail

          haxelib git mobile-controls https://github.com/ArkoseLabsOfficial/mobile-controls
          haxelib git hxcpp https://github.com/CodenameCrew/cne-hxcpp
          haxelib git openfl https://github.com/CodenameCrew/cne-openfl cne
          haxelib git lime https://github.com/CodenameCrew/cne-lime cne
          haxelib git flixel https://github.com/CodenameCrew/cne-flixel cne

          if [ -f haxelib.json ]; then
            haxelib install haxelib.json --always
          fi

      - name: Repair Lime native library
        shell: bash
        run: |
          set -euxo pipefail

          LIME_DIR="$(haxelib path lime | grep -m1 '/lime/' || true)"
          echo "Lime path: ${LIME_DIR:-not found}"

          if [ -z "$LIME_DIR" ]; then
            echo "Could not locate Lime through haxelib."
            haxelib list
            exit 1
          fi

          mkdir -p "$LIME_DIR/ndll/Linux64"

          if [ ! -f "$LIME_DIR/ndll/Linux64/lime.ndll" ]; then
            echo "lime.ndll is missing. Trying to rebuild the custom Lime source."
            haxelib run lime rebuild cpp
          fi

          if [ ! -f "$LIME_DIR/ndll/Linux64/lime.ndll" ]; then
            echo "ERROR: lime.ndll is still missing after rebuild."
            echo "The custom cne-lime source may need a compatible native Lime binary."
            find "$LIME_DIR" -iname '*lime*.ndll' -o -iname 'lime.ndll' || true
            exit 1
          fi

      - name: Configure Lime
        shell: bash
        run: |
          set -euxo pipefail
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f project.xml ]; then
            haxelib run lime build android -release
          elif [ -f Project.xml ]; then
            haxelib run lime build android -release Project.xml
          else
            echo "No project.xml found."
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodenameEngine-Android
          path: |
            export/android/bin/**/*.apk
            export/android/**/*.apk
            bin/**/*.apk
          if-no-files-found: warn
          retention-days: 14
